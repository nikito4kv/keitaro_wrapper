<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Офферы кампании</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="/static/fonts/golos-text-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/golos-text-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="page">
    <header class="top">
      <nav class="nav" aria-label="Разделы">
        <a class="nav-link" href="/">Новая кампания</a>
        <a class="nav-link" href="/campaigns" aria-current="true">Все кампании</a>
      </nav>
      <span class="conn" id="conn" data-state="checking">
        <span class="conn-dot" aria-hidden="true"></span>
        <span id="conn-text">Проверяем связь с Keitaro</span>
      </span>
    </header>

    <div class="banner" id="banner" role="alert" hidden>
      <p id="banner-text"></p>
      <button type="button" class="btn btn-quiet btn-small" id="banner-retry">Повторить</button>
    </div>

    <main class="narrow reveal">
      <a class="back" href="/campaigns">← Все кампании</a>

      <div class="editor-head">
        <div class="editor-title">
          <h1 id="campaign-name"><span class="skeleton-line" aria-hidden="true"></span></h1>
          <div class="camp-link" id="campaign-links"></div>
        </div>
        <div class="editor-sync">
          <button type="button" class="btn btn-quiet btn-small" id="refresh" disabled>
            <span class="spinner" aria-hidden="true"></span>
            <span class="btn-label">Обновить из Keitaro</span>
          </button>
          <p class="sync-note" id="sync-note"></p>
        </div>
      </div>

      <p class="visually-hidden" id="live" role="status" aria-live="polite"></p>

      <div class="streams" id="streams" aria-busy="true">
        <div class="skeleton"><span></span><span></span><span></span></div>
      </div>

      <p class="empty" id="no-streams" hidden>В этой кампании нет потоков. Добавьте поток в Keitaro и нажмите «Обновить из Keitaro».</p>
    </main>
  </div>

  <script type="module" src="/static/js/editor.js"></script>
</body>
</html>
