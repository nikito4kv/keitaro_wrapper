<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Все кампании Keitaro</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="/static/fonts/golos-text-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/golos-text-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="page">
    <header class="top">
      <nav class="nav" aria-label="Разделы">
        <a class="nav-link" href="/">Новая кампания</a>
        <a class="nav-link" href="/campaigns" aria-current="page">Все кампании</a>
      </nav>
      <span class="conn" id="conn" data-state="checking">
        <span class="conn-dot" aria-hidden="true"></span>
        <span id="conn-text">Проверяем связь с Keitaro</span>
      </span>
    </header>

    <div class="banner" id="banner" role="alert" hidden>
      <p id="banner-text"></p>
      <button type="button" class="btn btn-quiet btn-small" id="banner-retry">Повторить</button>
    </div>

    <main class="narrow reveal">
      <h1>Все кампании</h1>
      <p class="lead">Список берётся из Keitaro. Откройте кампанию, чтобы добавить или убрать офферы.</p>

      <div class="field list-search" id="search-field" hidden>
        <label for="search-input">Поиск</label>
        <input class="input" id="search-input" type="search" autocomplete="off" placeholder="Название или номер кампании">
      </div>

      <ul class="rows" id="rows" aria-busy="true">
        <li class="skeleton"><span></span><span></span></li>
        <li class="skeleton"><span></span><span></span></li>
        <li class="skeleton"><span></span><span></span></li>
      </ul>

      <div class="empty" id="empty" hidden>
        <p class="empty-title">В Keitaro пока нет кампаний</p>
        <p>Создайте первую на странице <a class="link" href="/">«Новая кампания»</a>, и она появится здесь.</p>
      </div>
      <p class="empty" id="nothing-found" hidden>Кампаний с таким названием или номером нет.</p>

      <button type="button" class="btn btn-quiet more" id="more" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-label">Показать ещё</span>
      </button>
    </main>
  </div>

  <script type="module" src="/static/js/campaigns.js"></script>
</body>
</html>
